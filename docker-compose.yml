# interview_ng 本地编排。两种用法：
#   开发：只用数据库 —— `podman compose up -d postgres`（`just db` 同义）
#   部署：完整栈 —— `JWT_SECRET=... podman compose up -d --build`，应用入口是宿主机 :8080
#
# 应用是**单镜像**：Caddy 在 :80 发静态产物并反代 /api、/ws，Go 后端在同容器内监听
# 回环 8080（两个进程由 deploy/entrypoint.sh 一起管）。镜像定义见根目录 Dockerfile。
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    userns_mode: keep-id
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    # 健康检查只作可观测性（`podman ps` 的 health 列、`podman healthcheck run`）。
    # 注意：podman-compose 不会因它推迟依赖方的启动，就绪等待在 app 的 entrypoint 里自己做
    # （否则首次 initdb 期间后端必然连不上而退出）。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: interview_ng:local
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      # host 走 compose 网络内的服务名；账号须与上面的 postgres 服务一致
      DATABASE_DSN: host=postgres user=postgres password=postgres dbname=interview port=5432 sslmode=disable TimeZone=Asia/Shanghai
      # 登录令牌签发密钥：没有安全的缺省值，故要求显式提供（缺失时 compose 直接报错）
      JWT_SECRET: ${JWT_SECRET:?请先设置 JWT_SECRET（export JWT_SECRET=... 或写进根目录 .env）}
      # 首次启动创建默认 admin 时用的初始密码；账号建好后改这里不再生效
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-admin}
    ports:
      # Caddy 的 :80 映射到宿主机（rootless podman 不能绑 <1024 的端口，故不用 80）
      - "${WEB_PORT:-8080}:80"
