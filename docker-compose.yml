version: "3.9"
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: interview_ng_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
