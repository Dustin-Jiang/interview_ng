# interview_ng 本地编排。两种用法：
#   开发：只用数据库 —— `podman compose up -d postgres`（`just db` 同义）
#   部署：完整栈 —— `JWT_SECRET=... podman compose up -d --build`，入口是宿主机 :8080
#
# 应用是**单进程单镜像**：一个 Go 进程同时提供 /api、/ws 与前端产物（WEB_ROOT=/srv/www），
# 静态与接口同源、无前置 web 服务器。镜像定义见根目录 Dockerfile。
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    userns_mode: keep-id
    container_name: interview_ng_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    # 健康检查只作可观测性（`podman ps` 的 health 列、`podman healthcheck run`）。
    # 就绪等待不靠它：后端启动时自己重试连库（DB_CONNECT_TIMEOUT，默认 60s），
    # 否则首次 initdb 期间后端会连不上而退出（podman-compose 不会等这个健康状态）。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: interview_ng:local
    container_name: interview_ng_app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      # host 走 compose 网络内的服务名；账号须与上面的 postgres 服务一致
      DATABASE_DSN: host=postgres user=postgres password=postgres dbname=interview port=5432 sslmode=disable TimeZone=Asia/Shanghai
      # 登录令牌签发密钥：没有安全的缺省值，故要求显式提供（缺失时 compose 直接报错）
      JWT_SECRET: ${JWT_SECRET:?请先设置 JWT_SECRET（export JWT_SECRET=... 或写进根目录 .env）}
      # 首次启动创建默认 admin 时用的初始密码；账号建好后改这里不再生效
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-admin}
    ports:
      # rootless podman 不能绑 <1024 的宿主机端口，故默认 8080（容器内也是 8080）
      - "${WEB_PORT:-8080}:8080"
